<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPL Ticket Booking</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h2>IPL Ticket Booking Form</h2>
    <a href="index.html">← Back to Home</a>
    <br /><br />

    <form action="#" method="POST">
      <!-- Name -->
      <p>
        <label>Full Name:</label><br />
        <input type="text" name="name" required minlength="3" />
      </p>

      <!-- Email -->
      <p>
        <label>Email Address:</label><br />
        <input type="email" name="email" required />
      </p>

      <!-- Phone -->
      <p>
        <label>Phone Number:</label><br />
        <input type="tel" name="phone" pattern="[0-9]{10}" required />
      </p>

      <!-- Match Selector -->
      <p>
        <label for="match-select">Select Match:</label><br />
        <select id="match-select" name="match">
          <option value="CSK vs MI" selected>CSK vs MI</option>
          <option value="RCB vs KKR">RCB vs KKR</option>
          <option value="GT vs RR">GT vs RR</option>
          <option value="SRH vs DC">SRH vs DC</option>
          <option value="LSG vs PBKS">LSG vs PBKS</option>
        </select>
      </p>

      <!-- Stand Category Selector -->
      <p>
        <label for="stand-select">Stand Category:</label><br />
        <select id="stand-select" name="stand">
          <option value="General Stand|800" selected>
            General Stand - ₹800
          </option>
          <option value="Pavilion Terrace|1800">
            Pavilion Terrace - ₹1,800
          </option>
          <option value="Club Lounge|3500">Club Lounge - ₹3,500</option>
          <option value="VIP Hospitality|6000">VIP Hospitality - ₹6,000</option>
        </select>
      </p>

      <!-- Ticket Quantity -->
      <p>
        <label for="ticket-qty">Ticket Quantity:</label><br />
        <input
          type="number"
          id="ticket-qty"
          name="quantity"
          min="1"
          max="10"
          value="1"
          required
        />
      </p>

      <button type="submit">Book Ticket</button>
    </form>

    <!-- Live Booking Summary -->
    <section id="booking-summary" class="summary-card">
      <h3>Booking Summary</h3>
      <p>Match: <strong id="summary-match">CSK vs MI</strong></p>
      <p>Stand Category: <strong id="summary-stand">General Stand</strong></p>
      <p>Quantity: <strong id="summary-qty">1</strong></p>
      <p>Total Price: <strong id="summary-total">₹800</strong></p>
    </section>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
  </body>
</html>
